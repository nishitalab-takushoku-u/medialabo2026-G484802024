<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>NHK番組表 検索システム</title>
    <style>
        body { 
            font-family: sans-serif; 
            padding: 20px; 
            background-image: url("haikei.jpg");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
        }
        .search-box { 
            margin-bottom: 20px; 
            padding: 15px; 
            background-color: white; 
            border: 1px solid white; 
        }
        .search-box label { 
            font-weight: bold; 
            margin-right: 5px; 
        }
        .search-box select, .search-box button { 
            padding: 5px; 
            margin-right: 15px; 
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 15px; 
            background-color: white;
        }
        th, td { 
            border: 1px solid black; 
            padding: 8px; 
            text-align: left; 
            font-size: 13px; 
        }
        th { 
            background-color: #eee; 
        }
    </style>
</head>
<body>

    <h1>NHK の番組表 検索システム</h1>

    <div class="search-box">
        <form id="searchForm">
            <label for="service">チャンネル:</label>
            <select id="service" name="service">
                <option value="g1">g1 (NHK総合1)</option>
                <option value="e1">e1 (Eテレ1)</option>
            </select>

            <label for="genre">ジャンル:</label>
            <select id="genre" name="genre">
                <option value="0000">ニュース・報道</option>
                <option value="0100">スポーツ</option>
                <option value="0409">音楽</option>
            </select>

            <button type="submit">検索実行</button>
        </form>
    </div>

    <div id="result"></div>

    <script src="tv-program.js"></script>
</body>
</html>
